<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link 
    rel="icon" 
    type="image/png" 
    sizes="32x32" 
    href="./images/favicon-32x32.png"
  >
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Normalize CSS -->
  <link 
    rel="stylesheet" 
    href="./node_modules/normalize.css/normalize.css"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link 
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" 
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>


  <main>
    <article class="qr-card">
  
  
      <img 
        src="./images/image-qr-code.png" 
        alt="QR Code" 
        class="qr-card__image"
      >
  
      <div class="qr-card__content">
        <h1 class="qr-card__title">
          Improve your front-end skills by building projects
        </h1>
  
        <p class="qr-card__description">
          Scan the QR code to visit Fronted Mentor and take your 
          coding skills to the next level
        </p>
      </div>
    </article>
  </main>

  <footer>
    <p class="footer__text">
      Challenge by 
      <a 
        href="https://www.frontendmentor.io/learning-paths/getting-started-on-frontend-mentor-XJhRWRREZd/challenge/65e6f48617e502f0b6ca3cfe/start" 
        target="_blank"
      >
        Frontend Mentor
      </a>. 
      Coded by 
      <a 
        href="https://github.com/CasteLeonardo" 
        target="_blank"
      >
        Leonardo Castelanos 
      </a>.
    </p>
  </footer>
  
</body>
</html>
